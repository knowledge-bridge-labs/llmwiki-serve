name: ci

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run python -c "import importlib.util; assert importlib.util.find_spec('fastembed') is None; assert importlib.util.find_spec('numpy') is None; from llmwiki_serve import LlmWikiService; print('base install smoke ok')"
      - run: uv run llmwiki-serve query ./examples/sample-wiki "release readiness"
      - run: uv sync --extra dev --extra vector --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check --output-format=github .
      - run: uv run mypy src
      - run: uv run mypy scripts/benchmark_adapters/scifact_runner.py
      - run: uv run pytest
      - run: uv build
      - run: uv run python scripts/release_smoke.py --dist-dir dist --allow-network-install

  windows-test:
    name: windows-test (${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run python -c "import importlib.util; assert importlib.util.find_spec('fastembed') is None; assert importlib.util.find_spec('numpy') is None; from llmwiki_serve import LlmWikiService; print('base install smoke ok')"
      - run: uv run llmwiki-serve query ./examples/sample-wiki "release readiness"
      - run: uv sync --extra dev --extra vector --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check --output-format=github .
      - run: uv run mypy src
      - run: uv run mypy scripts/benchmark_adapters/scifact_runner.py
      - run: uv run pytest
      - run: uv build
      - run: uv run python scripts/release_smoke.py --dist-dir dist --allow-network-install
