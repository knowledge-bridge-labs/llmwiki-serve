name: publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build, test, and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked base dependencies
        run: uv sync --locked
      - name: Smoke base install without vector extras
        run: >
          uv run python -c "import importlib.util;
          assert importlib.util.find_spec('fastembed') is None;
          assert importlib.util.find_spec('numpy') is None;
          from llmwiki_serve import LlmWikiService;
          print('base install smoke ok')"
      - name: Smoke packaged CLI path
        run: uv run llmwiki-serve query ./examples/sample-wiki "release readiness"
      - name: Install locked dev and vector dependencies
        run: uv sync --extra dev --extra vector --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check package
        run: uv run mypy src
      - name: Type check benchmark runners
        run: >
          uv run mypy
          scripts/benchmark_adapters/scifact_runner.py
          scripts/benchmark_adapters/nomiracl_ko_runner.py
          scripts/benchmark_adapters/orientation_mechanism_runner.py
      - name: Test
        run: uv run pytest
      - name: Build distributions
        run: uv build
      - name: Release smoke distributions
        run: uv run python scripts/release_smoke.py --dist-dir dist --allow-network-install
      - name: Twine check distributions
        run: uvx twine check dist/*
      - name: Write distribution checksum manifest
        run: >
          python scripts/release_dist_manifest.py write
          --dist-dir dist
          --manifest dist-sha256.json
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist-sha256.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: release-artifact
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv publish tool
        run: python -m pip install uv
      - name: Verify downloaded distribution checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          package = "llmwiki-serve"
          ignored_placeholder_files = {".gitignore"}
          root = Path("release-artifact")
          manifest_path = root / "dist-sha256.json"
          if not manifest_path.is_file():
              raise SystemExit("missing dist-sha256.json artifact")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if not isinstance(manifest, dict):
              raise SystemExit("checksum manifest must be a JSON object")
          if manifest.get("package") != package:
              raise SystemExit("unexpected package in checksum manifest")

          version = manifest.get("version")
          if not isinstance(version, str) or not version:
              raise SystemExit("checksum manifest is missing version")
          expected_names = {
              f"llmwiki_serve-{version}-py3-none-any.whl",
              f"llmwiki_serve-{version}.tar.gz",
          }
          files = manifest.get("files")
          if not isinstance(files, dict) or set(files) != expected_names:
              raise SystemExit(
                  "checksum manifest must describe exactly the expected wheel and sdist"
              )

          dist = root / "dist"
          if not dist.is_dir():
              raise SystemExit("missing downloaded dist directory")
          regular_files = sorted(path for path in dist.iterdir() if path.is_file())
          artifact_files = [
              path for path in regular_files if path.name not in ignored_placeholder_files
          ]
          actual_names = {path.name for path in artifact_files}
          if actual_names != expected_names:
              raise SystemExit(
                  f"downloaded dist files changed: {sorted(actual_names)} != "
                  f"{sorted(expected_names)}"
              )

          for path in artifact_files:
              expected_hash = files[path.name]
              if (
                  not isinstance(expected_hash, str)
                  or len(expected_hash) != 64
                  or any(character not in "0123456789abcdef" for character in expected_hash)
              ):
                  raise SystemExit(f"invalid sha256 for {path.name}")
              observed_hash = hashlib.sha256(path.read_bytes()).hexdigest()
              if observed_hash != expected_hash:
                  raise SystemExit(f"sha256 mismatch for {path.name}")
          PY
      - name: Publish to PyPI
        run: >
          uv publish --trusted-publishing always
          release-artifact/dist/*.whl
          release-artifact/dist/*.tar.gz
