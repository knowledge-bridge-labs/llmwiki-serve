name: publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build, test, and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked base dependencies
        run: uv sync --locked
      - name: Smoke base install without vector extras
        run: >
          uv run python -c "import importlib.util;
          assert importlib.util.find_spec('fastembed') is None;
          assert importlib.util.find_spec('numpy') is None;
          from llmwiki_serve import LlmWikiService;
          print('base install smoke ok')"
      - name: Smoke packaged CLI path
        run: uv run llmwiki-serve query ./examples/sample-wiki "release readiness"
      - name: Install locked dev and vector dependencies
        run: uv sync --extra dev --extra vector --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check package
        run: uv run mypy src
      - name: Type check benchmark runners
        run: >
          uv run mypy
          scripts/benchmark_adapters/scifact_runner.py
          scripts/benchmark_adapters/nomiracl_ko_runner.py
          scripts/benchmark_adapters/orientation_mechanism_runner.py
      - name: Test
        run: uv run pytest
      - name: Build distributions
        run: uv build
      - name: Release smoke distributions
        run: uv run python scripts/release_smoke.py --dist-dir dist --allow-network-install
      - name: Twine check distributions
        run: uvx twine check dist/*
      - name: Write distribution checksum manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))[
              "project"
          ]["version"]
          expected = {
              f"llmwiki_serve-{version}-py3-none-any.whl",
              f"llmwiki_serve-{version}.tar.gz",
          }
          files = sorted(path for path in Path("dist").iterdir() if path.is_file())
          actual = {path.name for path in files}
          if actual != expected:
              raise SystemExit(f"unexpected dist files: {sorted(actual)} != {sorted(expected)}")
          manifest = {
              "package": "llmwiki-serve",
              "version": version,
              "files": {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in files
              },
          }
          Path("dist-sha256.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist-sha256.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: release-artifact
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv publish tool
        run: python -m pip install uv
      - name: Verify downloaded distribution checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("release-artifact")
          manifest_path = root / "dist-sha256.json"
          if not manifest_path.is_file():
              raise SystemExit("missing dist-sha256.json artifact")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("package") != "llmwiki-serve":
              raise SystemExit("unexpected package in checksum manifest")
          files = manifest.get("files")
          if not isinstance(files, dict) or len(files) != 2:
              raise SystemExit("checksum manifest must describe exactly two dist files")
          expected_names = set(files)
          dist = root / "dist"
          actual_names = {path.name for path in dist.iterdir() if path.is_file()}
          if actual_names != expected_names:
              raise SystemExit(
                  f"downloaded dist files changed: {sorted(actual_names)} != "
                  f"{sorted(expected_names)}"
              )
          for name, expected_hash in files.items():
              observed_hash = hashlib.sha256((dist / name).read_bytes()).hexdigest()
              if observed_hash != expected_hash:
                  raise SystemExit(f"sha256 mismatch for {name}")
          PY
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always release-artifact/dist/*
