[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "llmwiki-serve"
version = "0.2.9"
description = "Serve existing Markdown, Obsidian-style, or LLMWiki folders as cited agent-readable context."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "LLMWiki Serve contributors" }]
keywords = ["llmwiki", "markdown", "obsidian", "agent-context", "mcp", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.139.2",
  "mcp>=1.28.1,<2",
  "psutil>=6.1",
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "snowballstemmer>=2.2.0",
  "typer>=0.27.0",
  "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
redis = [
  "redis>=5",
]
vector = [
  "fastembed>=0.8.0,<0.9.0",
  "numpy>=2.4.6,<2.5.0",
]
dev = [
  "certifi>=2026.6.17",
  "httpx>=0.27",
  "mypy>=2.3.0",
  "pytest>=8.2",
  "ruff>=0.15.22",
  "types-psutil>=7.0",
  "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://knowledge-bridge-labs.github.io/llmwiki-docs/"
Documentation = "https://knowledge-bridge-labs.github.io/llmwiki-docs/"
Repository = "https://github.com/knowledge-bridge-labs/llmwiki-serve"
Issues = "https://github.com/knowledge-bridge-labs/llmwiki-serve/issues"
Changelog = "https://github.com/knowledge-bridge-labs/llmwiki-serve/blob/main/CHANGELOG.md"

[project.scripts]
llmwiki-serve = "llmwiki_serve.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llmwiki_serve"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/THIRD_PARTY_NOTICES.md",
  "/benchmarks/agent_guided_lexical",
  "/benchmarks/orientation_mechanism",
  "/docs",
  "/examples",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/tests",
  "/uv.lock",
]
exclude = [
  "/.github",
  "/.llmwiki-work",
  "/.mypy_cache",
  "/.nox",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.runtime-logs",
  "/.tox",
  "/.venv",
  "/build",
  "/dist",
  "/docs/gtm-*",
  "/docs/quickstart-agent-context.md",
  "/htmlcov",
  "/specs/gtm-*",
  "/benchmarks/**/report-output",
  "/benchmarks/**/report-outputs",
  "/benchmarks/**/reports",
  "/**/.llmwiki-work",
  "/**/.runtime-logs",
  "/**/.DS_Store",
  "/**/.env",
  "/**/.env.*",
  "/**/*.py[cod]",
  "/**/__pycache__",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["llmwiki_serve"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]
